<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Library Lens</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <header>
    <div class="brand"><span class="brand-logo"><img src="icons/book-48.png" alt="" width="32" height="32"></span><h1>Library Lens</h1></div>
    <div class="header-actions">
      <button id="refresh-button" type="button" aria-label="Refresh book and library results" title="Re-read this page and refresh library results"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.6 9a7 7 0 0 1 11.6-2L20 12M4 12l2.8 5a7 7 0 0 0 11.6-2"/></svg></button>
      <button id="settings-button" type="button" aria-label="Settings" title="Settings — choose libraries and preferred format"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h5m4 0h7M4 12h9m4 0h3M4 18h2m4 0h10"/><circle cx="11" cy="6" r="2" fill="var(--surface)"/><circle cx="15" cy="12" r="2" fill="var(--surface)"/><circle cx="8" cy="18" r="2" fill="var(--surface)"/></svg></button>
    </div>
  </header>
  <main>
    <section id="setup-prompt" class="setup-prompt" hidden>
      <h2>Set up your libraries</h2>
      <p>Enter your ZIP code and choose up to three libraries in Settings.</p>
      <button id="setup-button" type="button" class="primary">Choose libraries</button>
    </section>
    <section id="pending-request" class="pending" aria-label="Prepared purchase request" hidden></section>
    <p id="page-status" class="notice" role="status">Reading this page…</p>
    <div id="candidate-section" hidden>
      <label for="candidates">Which book?</label>
      <select id="candidates"></select>
    </div>
    <form id="book-form" hidden>
      <details id="book-details">
      <summary class="book-summary" title="Edit book details"><span class="book-mark" aria-hidden="true"><img id="book-cover" alt="" referrerpolicy="no-referrer" hidden><svg id="cover-fallback" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h12a2 2 0 0 1 2 2v16H6a3 3 0 0 1-3-3V5a2 2 0 0 1 2-2Z"/><path d="M7 3v13M3 18a2 2 0 0 1 2-2h14M10 7h5m-5 4h4"/></svg></span><span class="book-info"><span id="book-summary-title">Choose a book</span><span id="book-summary-meta">Enter a title or ISBN</span></span><span class="edit-label">Edit</span></summary>
      <div class="book-editor">
      <label for="title">Title</label>
      <input id="title" name="title" maxlength="300" autocomplete="off" placeholder="Book title">
      <div class="fields">
        <div><label for="author">Author <span class="optional">optional</span></label><input id="author" name="author" maxlength="300" autocomplete="off" placeholder="Author’s name"></div>
        <div><label for="isbn">ISBN <span class="optional">optional</span></label><input id="isbn" name="isbn" maxlength="40" autocomplete="off" placeholder="ISBN-10 or ISBN-13" aria-describedby="form-error"></div>
      </div>
      <div class="fields">
        <div><label for="publisher">Publisher <span class="optional">optional</span></label><input id="publisher" name="publisher" maxlength="300" autocomplete="off"></div>
        <div><label for="publication-date">Publication date <span class="optional">optional</span></label><input id="publication-date" name="publication-date" maxlength="40" autocomplete="off" placeholder="YYYY or YYYY-MM-DD"></div>
      </div>
      <label for="language">Language <span class="optional">optional</span></label><input id="language" name="language" maxlength="80" autocomplete="off" placeholder="For example, English">
      </div>
      </details>
      <p id="form-error" class="error" role="alert" hidden></p>
    </form>
    <section class="libraries" aria-label="Library results" id="libraries" hidden></section>

  </main>
</body>
</html>
